name: businessentity-stack

services:
  # Identity is provided by the separately installed User Hub / external OIDC.
  postgres-production-db:
    container_name: postgres-production-db
    build:
      context: ./postgres_db
      dockerfile: Dockerfile
    ports:
      - "5470:5432"
    environment:
      POSTGRES_DB: main
      POSTGRES_USER: adm01
      POSTGRES_PASSWORD: adm01pwd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adm01 -d main"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - common

  # ── BusinessEntity App ────────────────────────────────────────────────────
  business-entity:
    container_name: business-entity-container
    build:
      context: .
      dockerfile: ./BusinessEntity/Dockerfile
    ports:
      - "7000:80"
    environment:
      ASPNETCORE_URLS: http://*:80
      ASPNETCORE_ENVIRONMENT: Development
      IS_DOCKER: "true"
      ConnectionStrings__DockerConnection: ${BUSINESS_ENTITY_CONNECTION:?configure the selected application database}
      Storage__RootPath: /app/storage
      Storage__HostRootPath: ${BUSINESS_ENTITY_STORAGE_HOST_ROOT:?configure the selected storage directory}
      Identity__KeyDirectory: /app/identity-keys
      UserHub__Url: ${USER_HUB_URL:-}
      Identity__InitialProvider__Id: ${IDENTITY_INITIAL_PROVIDER_ID:?configure initial provider}
      Identity__InitialProvider__Name: ${IDENTITY_INITIAL_PROVIDER_NAME:-OIDC provider}
      Identity__InitialProvider__Issuer: ${IDENTITY_INITIAL_ISSUER:?configure identity issuer}
      Identity__InitialProvider__MetadataAddress: ${IDENTITY_INITIAL_METADATA:?configure OpenID metadata}
      Identity__InitialProvider__ClientId: ${IDENTITY_INITIAL_CLIENT_ID:?configure identity client}
      Identity__InitialProvider__ClientSecretRef: client-a
      Identity__InitialProvider__BackchannelBaseAddress: ${IDENTITY_INITIAL_BACKCHANNEL:-}
      Identity__InitialProvider__ProvisioningKind: ${IDENTITY_INITIAL_PROVISIONING:-None}
      Identity__InitialProvider__ManagementEndpoint: ${IDENTITY_INITIAL_MANAGEMENT:-}
      Identity__InitialProvider__ManagementSecretRef: management-a
      Identity__InitialProvider__SubjectMode: user_uuid
      Identity__InitialProvider__PasswordResetAttribute: be_password_reset
      Identity__InitialProvider__PasswordResetFlowVerified: ${IDENTITY_PASSWORD_RESET_FLOW_VERIFIED:-false}
      Identity__InitialProvider__ManagedLocal: ${IDENTITY_MANAGED_LOCAL:-false}
      Identity__InitialProvider__ApiTokenProfiles__0__Issuer: ${IDENTITY_API_ISSUER:?configure API token issuer}
      Identity__InitialProvider__ApiTokenProfiles__0__MetadataAddress: ${IDENTITY_API_METADATA:?configure API metadata}
      Identity__InitialProvider__ApiTokenProfiles__0__Audience: ${IDENTITY_API_AUDIENCE:?configure API audience}
      Identity__InitialProvider__ApiTokenProfiles__0__AllowedClientIds__0: ${IDENTITY_API_AUDIENCE}
      Identity__InitialProvider__ApiTokenProfiles__0__ClientClaim: azp
      Identity__InitialProvider__ApiTokenProfiles__0__RequiredScope: be.api
      Identity__Secrets__client-a: ${IDENTITY_CLIENT_SECRET_A:?configure identity secret}
      Identity__Secrets__management-a: ${AUTHENTIK_API_TOKEN:-${AUTHENTIK_BOOTSTRAP_TOKEN}}
      Identity__Secrets__client-b: ${IDENTITY_CLIENT_SECRET_B:-}
      Identity__Secrets__management-b: ${IDENTITY_B_MANAGEMENT_TOKEN:-}
      Identity__Bootstrap__AdministratorIssuer: ${IDENTITY_BOOTSTRAP_ADMIN_ISSUER:?pin initial administrator issuer}
      Identity__Bootstrap__AdministratorSubject: ${IDENTITY_BOOTSTRAP_ADMIN_SUBJECT:?pin initial administrator subject}
    volumes:
      - ${BUSINESS_ENTITY_STORAGE_PATH:?select a separate storage directory}:/app/storage
      - ./.identity-keys:/app/identity-keys
    depends_on:
      postgres-production-db:
        condition: service_healthy
    networks:
      - common

  # ── Web Logger ────────────────────────────────────────────────────────────
  web_logger:
    container_name: web_logger-container
    build:
      context: .
      dockerfile: ./BlazorServerWebLogger/Dockerfile
    ports:
      - "5080:80"
    environment:
      ASPNETCORE_URLS: http://*:80
      ASPNETCORE_ENVIRONMENT: Development
      IS_DOCKER: "true"
      ConnectionStrings__DockerConnection: Host=postgres-production-db;Port=5432;Database=web_logger;Username=adm01;Password=adm01pwd
    depends_on:
      postgres-production-db:
        condition: service_healthy
    networks:
      - common

# External shared network used across scripts and containers
networks:
  common:
    external: true
    name: docker-business-entity-common-bridge

volumes:
  pgdata:
    driver: local
