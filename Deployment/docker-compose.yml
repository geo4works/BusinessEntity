name: businessentity-stack

services:
  # Identity is provided by the separately installed User Hub / external OIDC.
  postgres-production-db:
    container_name: postgres-production-db
    image: ${POSTGRES_PRODUCTION_IMAGE:?POSTGRES_PRODUCTION_IMAGE is required}
    environment:
      POSTGRES_DB: ${BE_POSTGRES_INITIAL_DB:-main}
      POSTGRES_USER: ${BE_DB_USER:-adm01}
      POSTGRES_PASSWORD: ${BE_DB_PASSWORD:?BE_DB_PASSWORD is required}
    ports:
      - "${BE_POSTGRES_PORT:-5470}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - common

  web_logger:
    container_name: web_logger-container
    image: ${WEB_LOGGER_IMAGE:?WEB_LOGGER_IMAGE is required}
    ports:
      - "${WEB_LOGGER_HTTP_PORT:-5080}:80"
    environment:
      ASPNETCORE_URLS: http://*:80
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      IS_DOCKER: "true"
      ConnectionStrings__DockerConnection: Host=postgres-production-db;Port=5432;Database=${WEB_LOGGER_DB_NAME:-web_logger};Username=${BE_DB_USER:-adm01};Password=${BE_DB_PASSWORD:?BE_DB_PASSWORD is required}
    depends_on:
      postgres-production-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - common

  business-entity:
    container_name: business-entity-container
    image: ${BE_IMAGE:?BE_IMAGE is required}
    env_file: [./identity-secrets.env]
    ports:
      - "${BUSINESSENTITY_HTTP_PORT:-7000}:80"
    environment:
      ASPNETCORE_URLS: http://*:80
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      IS_DOCKER: "true"
      ConnectionStrings__DockerConnection: Host=postgres-production-db;Port=5432;Database=${BE_DB_NAME:-business_entity};Username=${BE_DB_USER:-adm01};Password=${BE_DB_PASSWORD:?BE_DB_PASSWORD is required}
      IdentityConfigurationFile: /app/identity.initial.json
      Identity__KeyDirectory: /app/identity-keys
      UserHub__Url: ${USER_HUB_URL:-}
      Storage__RootPath: /app/storage
      Storage__HostRootPath: ${STORAGE_HOST_ROOT_PATH:-./storage}
    volumes:
      - ./storage:/app/storage
      - ./runtime/identity-keys:/app/identity-keys
      - ./identity.initial.json:/app/identity.initial.json:ro
    depends_on:
      postgres-production-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - common

networks:
  common:
    external: true
    name: ${DOCKER_NETWORK_NAME:-docker-business-entity-common-bridge}

volumes:
  pgdata:
    driver: local
